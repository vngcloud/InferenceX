# Gemma-4-31B FP8-block, prod flags (HCM gemma4 audit 2026-10-15) minus MTP,
# 2 replicas (TP1 each) behind vllm-router 0.1.14 consistent_hash
# (sticky per session: aiperf's X-Correlation-ID).
# LiveKit 111868 sizing ladder, v2 (spec 2026-10-16).
name: gemma4-livekit-2rep-chash-v2
runner: hardware-hcm-8x_01
image: vllm/vllm-openai:v0.25.1
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 2
replicas: 2
precision: fp8
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
  NCCL_P2P_LEVEL: NVL
serve: |
  vllm serve RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 64
  --max-num-batched-tokens 16384
  --enable-chunked-prefill
  --long-prefill-token-threshold 8192
  --kv-cache-metrics
  --enable-prompt-tokens-details
  --enable-auto-tool-choice
  --tool-call-parser gemma4
  --reasoning-parser gemma4
router:
  image: vllm/vllm-openai:v0.25.1
  metrics_port: 29000
  serve: >-
    bash -c "python3 -m pip install -q vllm-router==0.1.14
    && exec vllm-router --host 0.0.0.0 --port {{router_port}}
    --worker-urls {{engine_urls}} --policy consistent_hash
    --prometheus-host 127.0.0.1 --prometheus-port 29000
    --request-timeout-secs 14400 --disable-retries"
scenario: custom-agentic-livekit111868-v2
conc: [8, 16, 32, 64, 96, 128]
