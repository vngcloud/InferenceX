# Gemma-4-31B FP8-block on trtllm-serve 1.4.0rc1 (node-local squash on the hgx boxes),
# TP4 (was TP2) with max_num_tokens 4096 (was 2048), max_batch_size 128 (was 64,
# CUDA graphs follow to 128) and the MAX_UTILIZATION capacity scheduler policy
# (default GUARANTEED_NO_EVICT), FLASHINFER attention with KV prefix reuse and KV
# event publishing, LiveKit 111868 v1.1-warm traces across the CCU sweep
# (one job per conc).
# CLI notes for the 1.4.0rc1 image: MODEL is positional, flags are snake_case
# (--tensor_parallel_size, --tool_parser, --reasoning_parser), and the staged
# engine-args YAML is passed as --config (rc1's --extra-engine-args equivalent).
# --kv-block-size, --publish-kv-events and the scheduler policy have no rc1 CLI
# flags; they ride the engine-args YAML as kv_cache_config.tokens_per_block,
# kv_cache_config.kv_events_config.enable_kv_cache_events and
# scheduler_config.capacity_scheduler_policy.
name: gemma4-31b-fp8-trtllm-tp4-livekit-v1.1-warm
runner: hardware-hcm-8x_01
image: /mnt/sqsh/tensorrt-llm-1.4.0rc1.sqsh
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 4
precision: fp8
serve: |
  trtllm-serve serve
  RedHatAI/gemma-4-31B-it-FP8-block
  --served_model_name google/gemma-4-31b-it
  --tensor_parallel_size 4
  --max_batch_size 128
  --max_num_tokens 4096
  --max_seq_len 262144
  --tool_parser gemma4
  --reasoning_parser gemma4
engine-args:
  trust_remote_code: true
  enable_chunked_prefill: true
  attn_backend: FLASHINFER
  scheduler_config:
    capacity_scheduler_policy: MAX_UTILIZATION
  kv_cache_config:
    dtype: auto
    enable_block_reuse: true
    free_gpu_memory_fraction: 0.92
    tokens_per_block: 64
    kv_events_config:
      enable_kv_cache_events: true
  cuda_graph_config:
    enable_padding: true
    max_batch_size: 128
scenario: custom-agentic-livekit111868-v1.1-warm
conc: [16, 32, 64, 150, 200]
