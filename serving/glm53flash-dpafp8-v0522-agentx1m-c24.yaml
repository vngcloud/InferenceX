# GLM-5.3-Flash v0.5.22 best config, 1:1 of glm53flash-dpafp8-v0522-agentx-c24.yaml (run 39209786113, c24 met SLO
# on the 256k-capped replay) on the full-context replay agentx-cc-062126-1m (all 393 traces, requests up to ~990k).
# Only changes: --context-length 300000 -> 1048576 (model max_position_embeddings) and the scenario.
# KV pool on v0.5.22 is 2,850,048 tokens per DP rank, so one ~1M request fits a rank.
# GLM-5.3-W4AFP8 (8xH200 baseline) does not: its pool is 582,656 tokens per rank (run 38438344666).
name: glm53flash-dpafp8-v0522-agentx1m-c24
runner: hardware-hcm-8x_02
image: lmsysorg/sglang:v0.5.22
model: zai-org/GLM-5.3-Flash
gpus: 4
precision: fp8
env:
  SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: "1"
  SGLANG_DP_USE_GATHERV: "1"
  SGLANG_ENABLE_METRICS_DP_ATTENTION: "1"
  NCCL_P2P_LEVEL: NVL
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  HF_HUB_OFFLINE: "1"
serve: |
  python3 -m sglang.launch_server
  --model-path zai-org/GLM-5.3-Flash
  --served-model-name zai-org/GLM-5.3-Flash
  --tp-size 4 --ep-size 4 --dp-size 4 --enable-dp-attention
  --enable-dp-attention-local-control-broadcast --enable-dp-lm-head --mm-enable-dp-encoder
  --dist-init-addr 127.0.0.1:10888
  --moe-runner-backend deep_gemm
  --chunked-prefill-size 32768
  --tool-call-parser glm47 --reasoning-parser glm45
  --mem-fraction-static 0.88 --max-running-requests 64 --context-length 1048576 --allow-auto-truncate
  --kv-cache-dtype fp8_e4m3 --dsa-prefill-backend tilelang --dsa-decode-backend tilelang
  --enable-metrics --enable-metrics-for-all-schedulers --enable-cache-report
  --enable-hierarchical-cache --hicache-size 32
  --speculative-algorithm EAGLE --speculative-num-steps 5 --speculative-eagle-topk 1 --speculative-num-draft-tokens 6
  --mamba-radix-cache-strategy extra_buffer_lazy --mamba-ssm-dtype bfloat16
  --schedule-policy hrrn --max-mamba-cache-size 384
  --cuda-graph-backend-prefill disabled
router:
  image: lmsysorg/sglang:v0.5.22
  metrics_port: 18888
  serve: |
    python3 -m sglang_router.launch_router
    --host 0.0.0.0 --port {{router_port}} --prometheus-port 18888
    --worker-urls {{engine_url}}
    --policy cache_aware --dp-aware --balance-abs-threshold 8
    --request-id-headers x-correlation-id
    --connect-timeout-secs 900 --request-timeout-secs 14400
    --disable-health-check --disable-retries
scenario: agentx-cc-062126-1m
conc: 24
