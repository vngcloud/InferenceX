# e2B A/B arm (uniboost, c100): the engine/env/router config of
# gemma4-livekit-2tp4-dyn-sgl-fp8kv-pfbreak-fa4fp8mma-v11 (run 40085686661) at 1 replica on
# 4 GPUs of hgx-h200-01; only the schedule policy varies across arms. Engine image: the
# mentor's sglang-v0.5.22-ai1rc-cdce95199f sqsh + the uniboost overlay (14 files), node-local.
name: gemma4-livekit-1tp4-dyn-sgl-e2b-uniboost-c100
runner: hardware-hcm-8x_01
image: /mnt/loipp/enroot/images/sglang-v0.5.22-ai1rc-cdce95199f-uniboost-00b4f68fd4-amd64.sqsh
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 4
replicas: 1
host_cpus: 64
host_mem_gb: 192
precision: fp8
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
  AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
  PYTHONPATH: /workspace/runners/sglang_gemma4_bcg
serve: |
  python3 -m dynamo.sglang
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tp 4
  --context-length 262144
  --max-running-requests 256
  --attention-backend fa3
  --page-size 64
  --kv-cache-dtype fp8_e4m3
  --chunked-prefill-size 4096
  --schedule-policy boost --boost-bin-size 256 --boost-clock wall
  --boost-adaptive-gamma --boost-adaptive-max-jump-s 50
  --boost-preempt-wait-s 30 --boost-preempt-quantum-tokens 512 --boost-preempt-max-per-req 2
  --log-schedule-eval-path /workspace/results/schedule_eval.jsonl
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.92
  --enable-cache-report --enable-metrics
  --trust-remote-code
  --cuda-graph-backend-prefill breakable
  --dyn-tool-call-parser gemma4 --dyn-reasoning-parser gemma4
router:
  image: /mnt/ngoctg2-enroot/images/sglang-v0.5.22-gemma4-fp8kv-amd64.sqsh
  env:
    DYN_LOG: info,dynamo_kv_router::scheduling::selector=debug
  serve: |
    python3 -m dynamo.frontend
    --router-mode=kv --router-prefill-load-scale=16 --router-min-initial-workers=1
    --router-session-affinity-ttl-secs=1800 --router-session-affinity-mode=hard
scenario: custom-agentic-livekit111868-v1.1-warm
conc: [100]
