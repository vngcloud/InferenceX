# Smoke (180 s, c32) of serving/glm53-w4afp8-router-mooncake-e3-rdma.yaml: same config, checks that the RDMA L3 comes up.
# E3 Mooncake arm over RDMA: serving/glm53-w4afp8-router-mooncake-e3.yaml with the L3 moved from TCP to RDMA through the
# ConnectX-6 (rocep41s0f0, 10.200.3.1 on hgx-h200-01), set up as ai-system/distributed-kvcache-bench
# experiments/l3-what-matters-h200/mooncake.sbatch and checked by utils/serving/mooncake-rdma-test (job 4979:
# 12.2 GB/s put, 12.3 GB/s get, every byte verified; TCP 2.2 / 4.2 GB/s).
# - Only the CX-6: the seven E810s (irdma) cap a registration at 1 GiB and failed every earlier RDMA try (ENOMEM).
# - The storage sidecar runs the master plus 4 mooncake_store_service processes of 192 GiB = 768 GiB, the same L3 as
#   the TCP arm; the engine contributes no segment (MOONCAKE_GLOBAL_SEGMENT_SIZE=0) and only registers its host pools.
# - prlimit raises the soft memlock limit (Slurm copies the login node's ~1 GB) for the stores and the engine.
# - 10.200.3.1 is hgx-h200-01's CX-6 address: this file only runs on hardware-hcm-8x_01.
# E3 hidden-prefix A/B (mooncake arm): same engine/router/cache config as serving/glm53-w4afp8-router-mooncake-agentx.yaml, on the synthetic
# scenarios/agentx-hidden-prefix-e3.yaml trace (tool catalogs shared across DP groups, invisible to the router).
# Differs only in name, scenario and conc, plus --hicache-write-policy write_through: write_through_selective writes a node to L3 only after
# its 2nd hit on the SAME rank, which E3 (requests spread over ranks) rarely gives; simulated hit 0.86 -> 0.95.
# GLM-5.3 W4AFP8 on 8×H200, AgentX ladder (CCU 8/24/32/48): layout of serving/glm53-w4afp8-dynamo-agentx.yaml,
# values from the user's sbatch glm53_hicache_mooncake_8.sbatch (UbuntuWiki cloud/ai/llm/slum).
# Start order as in the sbatch: storage (Mooncake master + HTTP metadata server) first, the launcher waits for
# its port, then the router (smg) and the SGLang v0.5.21 engine with HiCache L2 buffer_only + L3 Mooncake.
# Left out of the sbatch: --numa-node, --host/--port, SGLANG_TORCH_PROFILER_DIR/SGLANG_PROFILE_WITH_STACK
# (profiling off), empty MOONCAKE_DEVICE (tcp), local model mounts (HF id instead).
# NVSHMEM_REMOTE_TRANSPORT=none / IBGDA=0: single-node DeepEP over NVLink only (non-mlx5 RoCE NICs segfault IBGDA).
# Runner _01 = hgx-h200-01 (hgx-h200-02 DRAIN when the sbatch was written).
# L2 is buffer_only (staging only), so --hicache-size is 48 GB per rank (~926k tokens at ~51.8 KB/token, about 3x the
# 300k context) instead of the sbatch's 128 GB. The DRAM that frees up goes to Mooncake L3 (see MOONCAKE_GLOBAL_SEGMENT_SIZE).
name: glm53-w4afp8-router-mooncake-e3-rdma-smoke
runner: hardware-hcm-8x_01
image: lmsysorg/sglang:v0.5.21
model: PhalaCloud/GLM-5.3-W4AFP8
gpus: 8
precision: w4afp8
env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  SGLANG_DP_USE_GATHERV: "1"
  SGLANG_ENABLE_METRICS_DP_ATTENTION: "1"
  NCCL_P2P_LEVEL: NVL
  HF_HUB_OFFLINE: "1"
  NVSHMEM_REMOTE_TRANSPORT: none
  NVSHMEM_IB_ENABLE_IBGDA: "0"
  MOONCAKE_MASTER: "10.200.3.1:{{storage_master_port}}"
  MOONCAKE_TE_META_DATA_SERVER: "http://10.200.3.1:{{storage_meta_port}}/metadata"
  # The engine mounts no segment: the 768 GiB L3 lives in the storage sidecar's 4 store services.
  MOONCAKE_GLOBAL_SEGMENT_SIZE: "0"
  # Buffer-mode anchor locks may pin up to this fraction of the L1 pool (default 0.5). Run 38765755189 c32 and
  # run 38705612370 c40 crashed with "Prefill out of memory" with every radix node locked (evictable 0).
  SGLANG_HICACHE_BUFFER_ANCHOR_LOCK_CAP: "0.2"
  MOONCAKE_PROTOCOL: rdma
  MOONCAKE_DEVICE: rocep41s0f0
  MOONCAKE_LOCAL_HOSTNAME: 10.200.3.1
  MC_TCP_BIND_ADDRESS: 10.200.3.1
  MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
serve: |
  prlimit --memlock=unlimited: python3 -m sglang.launch_server
  --model-path PhalaCloud/GLM-5.3-W4AFP8
  --quantization w4afp8
  --tp 8 --dp 8 --ep 8
  --enable-dp-attention --enable-dp-attention-local-control-broadcast --enable-dp-lm-head
  --tokenizer-worker-num 8
  --dist-init-addr 127.0.0.1:10888
  --moe-a2a-backend deepep
  --chunked-prefill-size 32768
  --tool-call-parser glm47 --reasoning-parser glm45
  --mem-fraction-static 0.75 --max-running-requests 256 --context-length 300000
  --kv-cache-dtype fp8_e4m3 --dsa-prefill-backend flashmla_sparse_q8
  --allow-auto-truncate
  --enable-metrics --enable-metrics-for-all-schedulers --enable-cache-report
  --enable-hierarchical-cache
  --hicache-size 48 --hicache-io-backend direct --hicache-write-policy write_through
  --hicache-host-memory-mode buffer_only
  --hicache-storage-backend mooncake
  --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
  --schedule-policy dfs-weight --schedule-conservativeness 3.33 --enable-prefill-delayer
  --served-model-name zai-org/GLM-5.3
storage:
  image: lmsysorg/sglang:v0.5.21
  env:
    MOONCAKE_PROTOCOL: rdma
    MOONCAKE_DEVICE: rocep41s0f0
    MOONCAKE_MASTER: "10.200.3.1:{{storage_master_port}}"
    MOONCAKE_TE_META_DATA_SERVER: "http://10.200.3.1:{{storage_meta_port}}/metadata"
    MOONCAKE_LOCAL_HOSTNAME: 10.200.3.1
    MC_TCP_BIND_ADDRESS: 10.200.3.1
    MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    MOONCAKE_GLOBAL_SEGMENT_SIZE: 192gb
    MOONCAKE_LOCAL_BUFFER_SIZE: "0"
  # Master (client_ttl 300: a store stalled while the engine pins its pools must not be dropped), then 4 stores of
  # 192 GiB each, interleaved over both NUMA nodes. Written out without shell variables (the validator rejects $).
  serve: |
    prlimit --memlock=unlimited: bash -c '
    mooncake_master --port={{storage_master_port}} --enable_http_metadata_server=true --http_metadata_server_port={{storage_meta_port}} --eviction_high_watermark_ratio=0.95 --client_ttl=300 &
    sleep 5;
    numactl --interleave=all python3 -m mooncake.mooncake_store_service --port=28081 --max-wait-time 600 &
    numactl --interleave=all python3 -m mooncake.mooncake_store_service --port=28082 --max-wait-time 600 &
    numactl --interleave=all python3 -m mooncake.mooncake_store_service --port=28083 --max-wait-time 600 &
    numactl --interleave=all python3 -m mooncake.mooncake_store_service --port=28084 --max-wait-time 600 &
    wait'
router:
  image: vcr.vngcloud.vn/60108-backend-worker/portal-external/dev/sglang-router-patched:v0.5.18-slim-noargcanon
  metrics_port: 18888
  serve: |
    /work/target/release/smg launch
    --host=0.0.0.0 --port={{router_port}} --prometheus-port=18888
    --policy=cache_aware --dp-aware
    --worker-urls={{engine_url}}
    --cache-threshold=0.3
    --balance-abs-threshold=100000 --balance-rel-threshold=2.0
    --max-tree-size=67108864 --eviction-interval=300
    --health-check-interval-secs=15 --health-check-timeout-secs=10 --health-failure-threshold=5
    --request-timeout-secs=900 --retry-max-retries=2
scenario: agentx-hidden-prefix-e3-smoke
conc: [32]
