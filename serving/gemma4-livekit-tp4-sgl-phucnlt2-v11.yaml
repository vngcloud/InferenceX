# SGLang phucnlt2 arm (gemma4-livekit-2tp4-dyn-sgl-fp8kv-pfbreak-v11, max CCU 96 under the AIPerf SLA)
# as ONE direct TP4 server: no Dynamo, no router. = gemma4-livekit-sgl-tp4-fp8kv-v11 (ngoctg2 stack, plain
# sglang.launch_server) + --cuda-graph-backend-prefill breakable + runners/sglang_gemma4_bcg/sitecustomize.py
# (Gemma4 prefill CUDA graph, see the pfbreak arm header). Fixed CCU: c50 then c80 on one boot.
name: gemma4-livekit-tp4-sgl-phucnlt2-v11
runner: hardware-hcm-4x_01
image: /data/ngoctg2-enroot/images/sglang-v0.5.22-gemma4-fp8kv-amd64.sqsh
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 4
precision: fp8
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
  PYTHONPATH: /workspace/runners/sglang_gemma4_bcg
serve: |
  python3 -m sglang.launch_server
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --tp 4
  --context-length 262144
  --max-running-requests 128
  --attention-backend fa3
  --page-size 64
  --kv-cache-dtype fp8_e4m3
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.92
  --enable-cache-report --enable-metrics
  --tool-call-parser gemma4 --reasoning-parser gemma4
  --trust-remote-code
  --cuda-graph-backend-prefill breakable
scenario: custom-agentic-livekit111868-v1.1-warm
conc: [50, 80]
