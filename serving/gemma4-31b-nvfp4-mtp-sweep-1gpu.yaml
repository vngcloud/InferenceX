# Gemma-4-31B NVFP4, exact RTX6000 Pro PROD engine flags (container gemma4-31b-nvfp4 on
# rtx6000pro-prod, audit 2026-10-19): nightly 81198e97 build, kv fp8_e4m3, max-num-seqs 128,
# async-scheduling, prefix caching, MTP 4 tokens (draft google/gemma-4-31B-it-assistant).
# Uses the k_scale/v_scale-stripped Green-Lab checkpoint revision so the public vLLM build
# boots without the prod gemma4_mm.py patch. 1 GPU, no router.
# Dispatches the full 24-scenario sweep ladder as one run, one job per scenario.
name: gemma4-31b-nvfp4-mtp-sweep-1gpu
runner: hcm-rtx6000pro_01
image: vllm/vllm-openai:nightly-81198e97ba7eee2a22540caaa756b7fdddcb4d93
model: Green-Lab/Gemma-4-31B-IT-NVFP4
gpus: 1
precision: nvfp4
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
serve: |
  vllm serve Green-Lab/Gemma-4-31B-IT-NVFP4
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 128
  --max-num-batched-tokens 16384
  --long-prefill-token-threshold 8192
  --kv-cache-dtype fp8_e4m3
  --enable-prefix-caching
  --async-scheduling
  --kv-cache-metrics
  --enable-prompt-tokens-details
  --speculative-config '{"model": "google/gemma-4-31B-it-assistant", "num_speculative_tokens": 4, "method": "mtp"}'
  --enable-auto-tool-choice
  --tool-call-parser gemma4
  --reasoning-parser gemma4
scenario:
- sweep-isl128k-osl1k-cache0
- sweep-isl128k-osl1k-cache50
- sweep-isl128k-osl1k-cache90
- sweep-isl128k-osl512-cache0
- sweep-isl128k-osl512-cache50
- sweep-isl128k-osl512-cache90
- sweep-isl32k-osl1k-cache0
- sweep-isl32k-osl1k-cache50
- sweep-isl32k-osl1k-cache90
- sweep-isl32k-osl512-cache0
- sweep-isl32k-osl512-cache50
- sweep-isl32k-osl512-cache90
- sweep-isl64k-osl1k-cache0
- sweep-isl64k-osl1k-cache50
- sweep-isl64k-osl1k-cache90
- sweep-isl64k-osl512-cache0
- sweep-isl64k-osl512-cache50
- sweep-isl64k-osl512-cache90
- sweep-isl8k-osl1k-cache0
- sweep-isl8k-osl1k-cache50
- sweep-isl8k-osl1k-cache90
- sweep-isl8k-osl512-cache0
- sweep-isl8k-osl512-cache50
- sweep-isl8k-osl512-cache90
conc: 1
