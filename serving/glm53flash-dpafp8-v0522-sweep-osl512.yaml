# GLM-5.3-Flash v0.5.22 best config (same engine/router flags as glm53flash-dpafp8-v0522-agentx-c24.yaml,
# run 39209786113 met SLO at c24) over the 24-scenario sweep ladder, split in two halves that run in
# parallel on hgx-h200-02: this file = 11 OSL 512 scenarios on runner hardware-hcm-4x_02, the other half = glm53flash-dpafp8-v0522-sweep-osl1k.yaml on hardware-hcm-8x_02.
# Slurm gres hands each half 4 disjoint GPUs (no manual pinning). Fixed ports differ per half
# (--dist-init-addr 20888, router prometheus 28888) because both jobs share the host network.
# sweep-isl128k-osl512-cache0 dropped: smoke run 39229161457 already measured it (no_pass_in_range, TTFT avg ~15 s at c1).
# Dispatch: utils/serving/dispatch.sh serving/glm53flash-dpafp8-v0522-sweep-osl512.yaml --ref <branch with the 4x schema change>
name: glm53flash-v0522-sweep-osl512
runner: hardware-hcm-4x_02
image: lmsysorg/sglang:v0.5.22
model: zai-org/GLM-5.3-Flash
gpus: 4
precision: fp8
env:
  SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: "1"
  SGLANG_DP_USE_GATHERV: "1"
  SGLANG_ENABLE_METRICS_DP_ATTENTION: "1"
  NCCL_P2P_LEVEL: NVL
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  HF_HUB_OFFLINE: "1"
serve: |
  python3 -m sglang.launch_server
  --model-path zai-org/GLM-5.3-Flash
  --served-model-name zai-org/GLM-5.3-Flash
  --tp-size 4 --ep-size 4 --dp-size 4 --enable-dp-attention
  --enable-dp-attention-local-control-broadcast --enable-dp-lm-head --mm-enable-dp-encoder
  --dist-init-addr 127.0.0.1:20888
  --moe-runner-backend deep_gemm
  --chunked-prefill-size 32768
  --tool-call-parser glm47 --reasoning-parser glm45
  --mem-fraction-static 0.88 --max-running-requests 64 --context-length 300000 --allow-auto-truncate
  --kv-cache-dtype fp8_e4m3 --dsa-prefill-backend tilelang --dsa-decode-backend tilelang
  --enable-metrics --enable-metrics-for-all-schedulers --enable-cache-report
  --enable-hierarchical-cache --hicache-size 32
  --speculative-algorithm EAGLE --speculative-num-steps 5 --speculative-eagle-topk 1 --speculative-num-draft-tokens 6
  --mamba-radix-cache-strategy extra_buffer_lazy --mamba-ssm-dtype bfloat16
  --schedule-policy hrrn --max-mamba-cache-size 384
  --cuda-graph-backend-prefill disabled
router:
  image: lmsysorg/sglang:v0.5.22
  metrics_port: 28888
  serve: |
    python3 -m sglang_router.launch_router
    --host 0.0.0.0 --port {{router_port}} --prometheus-port 28888
    --worker-urls {{engine_url}}
    --policy cache_aware --dp-aware --balance-abs-threshold 8
    --request-id-headers x-correlation-id
    --connect-timeout-secs 900 --request-timeout-secs 14400
    --disable-health-check --disable-retries
scenario:
- sweep-isl8k-osl512-cache0
- sweep-isl8k-osl512-cache50
- sweep-isl8k-osl512-cache90
- sweep-isl32k-osl512-cache0
- sweep-isl32k-osl512-cache50
- sweep-isl32k-osl512-cache90
- sweep-isl64k-osl512-cache0
- sweep-isl64k-osl512-cache50
- sweep-isl64k-osl512-cache90
- sweep-isl128k-osl512-cache50
- sweep-isl128k-osl512-cache90
conc: 1
