# GreenNode Tuning (offered) = gemma4-livekit-tp4-vllm-khanghd-v11 at TP2: one direct TP2 server (2x H200), no router.
# Only changes vs the TP4 file: gpus 4 -> 2, --tensor-parallel-size 4 -> 2, conc [24], runner 8x_02 (node 02 free on
# 2026-10-22, node 01 held). Sizing check: TP4 held TTFT p95 (user turns) 438 ms at c50; TP2 estimated ~20-30 CCU.
name: gemma4-livekit-tp2-vllm-khanghd-v11
runner: hardware-hcm-8x_02
image: vcr.vngcloud.vn/108942-public69/dynamo-stack/vllm-runtime:0.31.0-dyn1.6.0.dev20261018-g4strip
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 2
precision: fp8
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
  NCCL_P2P_LEVEL: NVL
  PYTHONPATH: /workspace/runners/vllm_pr57613
serve: |
  vllm serve RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tensor-parallel-size 2
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 128
  --max-num-batched-tokens 8192
  --enable-chunked-prefill
  --long-prefill-token-threshold 2048
  --kv-cache-metrics
  --prefix-cache-retention-interval 4096
  --enable-auto-tool-choice
  --tool-call-parser gemma4
  --reasoning-parser gemma4
scenario: custom-agentic-livekit111868-v1.1-warm
conc: [24]
