# Gemma-4-31B FP8-block, MTP spec decode (4 tokens), FlashInfer attention, TP1, one H200,
# tau2 smoke scenario. Dispatch: utils/serving/dispatch.sh serving/gemma4-31b-fp8-mtp4-tau2smoke.yaml
name: gemma4-31b-fp8-mtp4-tau2smoke
runner: h200-greennode-slurm-1x_01
image: vllm/vllm-openai:v0.28.0
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 1
precision: fp8
env:
  VLLM_ATTENTION_BACKEND: FLASHINFER
serve: |
  vllm serve RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --trust-remote-code
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 64
  --max-num-batched-tokens 16384
  --enable-chunked-prefill
  --long-prefill-token-threshold 8192
  --speculative-config '{"method": "mtp", "model": "google/gemma-4-31B-it-assistant", "num_speculative_tokens": 4}'
  --enable-auto-tool-choice
  --tool-call-parser gemma4
  --reasoning-parser gemma4
scenario: custom-agentic-tau2-smoke
conc: [8]
