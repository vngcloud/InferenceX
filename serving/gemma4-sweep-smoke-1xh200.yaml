# Smoke config for the sweep scenarios: Gemma-4-31B FP8-block, SGLang v0.5.22, 1xH200, no router, no spec.
# Copied from the serving YAML of run 39047930354 (gemma4-livekit-sgl-fa4-1gpu-v1-c4); only name, runner, scenario, conc changed.
name: gemma4-sweep-smoke-1gpu
runner: h200-greennode-slurm-1x_01
image: lmsysorg/sglang:v0.5.22-cu130
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 1
precision: fp8
env:
  NCCL_P2P_LEVEL: NVL
  # Smoke the IX_SLO override path too (replaces the scenario's default SLO):
  # TPOT/ITL p90 < 10 ms per user request for this smoke run.
  IX_SLO: "inter_token_latency:p90:lt:10"
serve: |
  python3 -m sglang.launch_server
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --tp 1
  --attention-backend fa4
  --chunked-prefill-size 16384
  --max-prefill-tokens 32768
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.15
  --mem-fraction-static 0.90
  --page-size 1
  --context-length 262144
  --enable-metrics --enable-cache-report
  --reasoning-parser gemma4 --tool-call-parser gemma4
scenario: sweep-isl8k-osl512-cache50
conc: 1
