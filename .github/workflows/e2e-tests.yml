name: AgentX EP A-B h200-2
run-name: AgentX EP A-B h200-2 screening
on:
  workflow_dispatch:
    inputs:
      duration-override:
        type: string
        default: '1200'
      agentx-fast:
        type: boolean
        default: false
      start-from:
        description: First point to run; resume options rely on artifacts preserved by earlier runs
        type: choice
        options:
          - a_ep1
          - a_ep8
          - b_ep8
          - diag_b_ep8
          - matched_b_ep8
          - matched_b_ep1
          - distribution_b_ep1
        default: a_ep1
permissions:
  contents: read
concurrency:
  group: agentx-h200-2-exclusive
  cancel-in-progress: false
jobs:
  a_ep1:
    if: inputs.start-from == 'a_ep1'
    runs-on: [self-hosted, h200-greennode_06]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate screening controls
        env:
          DURATION_OVERRIDE: ${{ inputs.duration-override }}
          FAST: ${{ inputs.agentx-fast }}
        run: test "$DURATION_OVERRIDE" = 1200 && test "$FAST" = false
      - name: Run a_ep1
        run: python3 experimental/agentx_ep_ab/run.py a_ep1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agentx-ab-a_ep1
          path: |
            campaign-results/a_ep1/**
            !campaign-results/a_ep1/hf-cache/**
          if-no-files-found: error
          retention-days: 14
  a_ep8:
    needs: a_ep1
    if: always() && (needs.a_ep1.result == 'success' || inputs.start-from == 'a_ep8')
    runs-on: [self-hosted, h200-greennode_06]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
