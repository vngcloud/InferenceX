name: gn-benchmark
run-name: ${{ inputs.test-name }}
# VNG serving-YAML benchmarks (inferencex-e2e/docs/serving/ARCHITECTURE.md).
# Dispatch with inferencex-e2e/utils/serving/dispatch.sh, which validates first.
on:
    workflow_dispatch:
        inputs:
            serving:
                description: "Serving YAML text (inferencex-e2e/configs/serving/*.yaml)"
                required: true
                type: string
            test-name:
                description: "Run title, printed by dispatch.sh"
                required: true
                type: string

permissions:
    contents: read

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            points: ${{ steps.plan.outputs.points }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
            - id: plan
              working-directory: inferencex-e2e
              env:
                  SERVING_YAML: ${{ inputs.serving }}
                  PYTHONPATH: ${{ github.workspace }}/inferencex-e2e
              run: |
                  printf '%s\n' "$SERVING_YAML" > "$RUNNER_TEMP/serving.yaml"
                  points=$(uv run --no-project --python 3.12 --with pydantic --with pyyaml \
                    python -P -m infx.serving.to_matrix "$RUNNER_TEMP/serving.yaml")
                  echo "points=$points" >> "$GITHUB_OUTPUT"

    bench:
        needs: plan
        uses: $/.github/workflows/benchmark-tmpl.yml
        name: gn-benchmark /
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.points) }}
        secrets:
            INFERENCEX_OFFICIAL_RO_HF_TOKEN: ${{ secrets.INFERENCEX_OFFICIAL_RO_HF_TOKEN }}
            SERVING_API_KEY: ${{ matrix.api_key_secret && secrets[matrix.api_key_secret] || '' }}
        with:
            config: ${{ toJSON(matrix.config) }}
            serving: ${{ matrix.serving }}
            runner: ${{ matrix.config.runner }}
            priority: "0"
            queue-token: serving
            dp-attn: false
            run-eval: false
            scenario-type: agentic-coding
            duration: ${{ matrix.config.duration }}
            test-name: ${{ inputs.test-name }}

    # One report over every point of the run (.agents/skills/result-report), on the run's summary
    # page; report.html is a separate artifact that opens without unzipping.
    report:
        needs: [plan, bench]
        if: ${{ always() && needs.plan.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .agents/skills/result-report
            - name: Render report
              env:
                  GH_TOKEN: ${{ github.token }}
                  TITLE: ${{ inputs.test-name }}
              run: |
                  python3 .agents/skills/result-report/scripts/result_report.py "$GITHUB_RUN_ID" \
                    --repo "$GITHUB_REPOSITORY" --title "$TITLE" --html --out report 2>&1 \
                    | grep -v '^fetching' || true
                  rm -rf report/.cache
                  if [ -f report/report.md ]; then
                      cat report/report.md >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "No report: no point produced a result (see the bench jobs)." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload report.html
              if: ${{ hashFiles('report/report.html') != '' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  path: report/report.html
                  archive: false
            - name: Upload report data
              if: ${{ hashFiles('report/data.json') != '' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: report
                  path: |
                      report/report.md
                      report/data.json
