schemaVersion: "2.0"
benchmark:
  scenario: inferencex-agentx-mvp
  unsafeOverride: true
  endpoint:
    type: chat
    path: /v1/chat/completions
    streaming: true
    useServerTokenCount: true
  datasets:
  - name: glm53-prod-ccu
    type: file
    format: mooncake_trace
    path: ${IX_CUSTOM_DATASET_FILE}
    entries: 300
    randomSeed: 42
    traceIdleGapCapSeconds: 300.0
    # File order is chronological; shuffle so every lane pass draws from all sessions.
    sampling: shuffle
  phases:
  - name: profiling
    kind: profiling
    type: concurrency
    duration: 3600.0
    gracePeriod: 30.0
    failedRequestThreshold: 0.2  # forced-length cuts inside a tool call stream no content (~4-7% on GLM-5.3)
    trajectoryStartMinRatio: 0.25
    trajectoryStartMaxRatio: 0.75
    warmupRequestsPerLane: 10
    agenticWarmupGracePeriod: 1800.0
  artifacts:
    sliceDuration: 1.0
  tokenizer:
    trustRemoteCode: true
  runtime:
    statsInterval: 30.0
randomSeed: 42
