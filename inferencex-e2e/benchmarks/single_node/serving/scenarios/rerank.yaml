schemaVersion: "2.0"
benchmark:
  endpoint:
    type: cohere_rankings
    # vLLM and SGLang both serve the Cohere-shaped {query, documents} body here.
    path: /v1/rerank
  datasets:
  - name: main
    type: synthetic
    entries: 1000
    randomSeed: 42
    rankings:
      queryTokens: 32
      passages: 10
      passageTokens: 512
  phases:
  - name: profiling
    kind: profiling
    type: concurrency
    duration: 300.0
    gracePeriod: 30.0
    failedRequestThreshold: 0.1
randomSeed: 42
