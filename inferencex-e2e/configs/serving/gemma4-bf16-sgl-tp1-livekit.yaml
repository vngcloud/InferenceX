# MAX-parity arm: plain SGLang BF16 on the LiveKit v1.1-warm trace (1200 s) at MAX's CCU 8,
# mirroring stock MAX job 9717 (prefix caching on).
name: gemma4-bf16-sgl-tp1-livekit
runner: cluster:han-h200-01
image: lmsysorg/sglang:v0.5.23
model: google/gemma-4-31B-it
gpus: 1
precision: bf16
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
serve: |
  python3 -m sglang.launch_server
  --model-path google/gemma-4-31B-it
  --trust-remote-code
  --tp 1
  --context-length 262144
  --max-running-requests 64
  --attention-backend fa4
  --page-size 64
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.90
  --enable-cache-report --enable-metrics
  --tool-call-parser gemma4 --reasoning-parser gemma4
scenario: livekit
conc: [8]
