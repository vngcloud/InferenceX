name: bge-m3-sglang-embed
runner: cluster:hcm-rtx02  # only node with the sglang v0.5.22 squash; hcm-rtx01 /data is full
image: lmsysorg/sglang:v0.5.22-cu130
model: BAAI/bge-m3
gpus: 1
# sglang XLM-RoBERTa asserts each sequence is whole and starts at position 0: no chunked prefill, no radix cache.
serve: |
  python3 -m sglang.launch_server
  --model-path BAAI/bge-m3
  --served-model-name bge-m3
  --is-embedding
  --context-length 8192
  --mem-fraction-static 0.2
  --enable-metrics
  --chunked-prefill-size -1
  --disable-radix-cache
scenario: embed
workload: {isl: [2k], batch: [32]}
overrides: {duration: 60}
conc: 4
