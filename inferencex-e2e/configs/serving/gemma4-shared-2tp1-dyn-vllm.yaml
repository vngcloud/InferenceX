# Gemma 4 shared pool on the Dynamo stack we run for LiveKit: two single-GPU dynamo.vllm engines
# behind the Dynamo frontend KV router. Engine flags are the shared-pool prod ones
# (gemma4-shared-2tp1-cacheaware-prod), MTP included, so the diff is the router, the image and the
# parser route:
# - Image vllm-runtime:0.31.0-dyn1.6.0-g4p2-prod, the LiveKit prod image (vLLM 0.31.0 +
#   vllm-project/vllm#57613, ai-dynamo 1.6.0 + ai-dynamo/dynamo#17486). This also moves vLLM from
#   0.25.1 to 0.31.0.
# - KV router with the LiveKit prefill load scale 16, no session affinity: shared-pool clients send
#   no x-dynamo-session-id.
# - Parsing in the frontend on the unified route (DYN_PARSER_VERSION=2, router.log shows
#   "Selected model parser route ... parser_version=V2"), not vLLM's gemma4 parsers.
# - No --enable-prompt-tokens-details: dynamo.vllm only takes engine args, and the frontend
#   reports cached_tokens anyway.
name: gemma4-shared-2tp1-dyn-vllm
runner: cluster:hcm-hgx02
image: vcr.vngcloud.vn/108942-public69/dynamo-stack/vllm-runtime:0.31.0-dyn1.6.0-g4p2-prod
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 2
replicas: 2
precision: fp8
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
  NCCL_P2P_LEVEL: NVL
serve: |
  python3 -m dynamo.vllm
  --model RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 64
  --max-num-batched-tokens 16384
  --enable-chunked-prefill
  --long-prefill-token-threshold 8192
  --kv-cache-metrics
  --speculative-config '{"model": "google/gemma-4-31B-it-assistant", "num_speculative_tokens": 4, "method": "mtp"}'
  --dyn-tool-call-parser gemma4 --dyn-reasoning-parser gemma4
router:
  image: vcr.vngcloud.vn/108942-public69/dynamo-stack/vllm-runtime:0.31.0-dyn1.6.0-g4p2-prod
  env:
    DYN_PARSER_VERSION: "2"
    DYN_LOG: info,dynamo_kv_router::scheduling::selector=debug
  serve: |
    python3 -m dynamo.frontend
    --router-mode=kv --router-prefill-load-scale=16 --router-min-initial-workers=2
scenario: agentx
overrides: {duration: 1200}
conc: [16, 32, 64]
