# Pattern: agentx-cc-062126-1m ladder (AI Coding, full-context replay: all 393 CC traces, requests up to
# ~990k tokens, maxContextLength cap removed via overrides). Same fa3 engine as the winning fixed-CCU
# sweep config qwen38-fp8-eagle-v0523-sweep-1gpu (run 41170766014: ctx 1M YaRN, EAGLE 3/1/4, hicache 64,
# mamba cache clamps max-running-requests to ~65). agentx has no adaptive search, so the ladder finds
# the max CCU under the default SLO (TTFT avg < 8s, ITL p90 < 50ms); pick the highest passing rung.
# Low rungs: the 8/16/24/32 ladder (run 41600805405) failed SLO at c8 already (TTFT avg 14.7s,
# ITL p90 79.5ms — long 300k+ ISL traces dominate the mean on 1 GPU), so the max SLO CCU is < 8.
name: qwen38-fp8-fa3-agentx1m-ladder-low
runner: h200-hcm
image: lmsysorg/sglang:v0.5.23
model: Qwen/Qwen3.8-27B-FP8
gpus: 1
precision: fp8
env:
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
  SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
serve: |
  python3 -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B-FP8
  --trust-remote-code
  --kv-cache-dtype fp8_e4m3
  --mem-fraction-static 0.85
  --attention-backend fa3
  --chunked-prefill-size 8192
  --max-prefill-tokens 16384
  --json-model-override-args '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  --context-length 1000000
  --max-running-requests 256
  --speculative-algorithm EAGLE --speculative-num-steps 3
  --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
  --enable-linear-replayssm-spec
  --mamba-full-memory-ratio 1.5
  --schedule-policy dfs-weight
  --enable-hierarchical-cache --hicache-size 64
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --enable-metrics --enable-cache-report
scenario: agentx
overrides:
  max_context_length: null
conc: [1, 2, 4]
