# MAX-parity arm: plain SGLang BF16 TP4, no router, prefix caching on like MAX's Gemma cells.
# ISL 8k mirrors MAX job 9015 (its only passing fixed-seq TP4 point).
name: gemma4-bf16-sgl-tp4-synth-isl8k
runner: cluster:hcm-hgx02
image: lmsysorg/sglang:v0.5.23
model: google/gemma-4-31B-it
gpus: 4
precision: bf16
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
serve: |
  python3 -m sglang.launch_server
  --model-path google/gemma-4-31B-it
  --trust-remote-code
  --tp 4
  --context-length 262144
  --max-running-requests 160
  --attention-backend fa3
  --page-size 64
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.92
  --enable-cache-report --enable-metrics
  --tool-call-parser gemma4 --reasoning-parser gemma4
scenario: synthetic
workload: {isl: [8k], osl: [1k], cache: [0], search: false}
conc: [8, 32]
