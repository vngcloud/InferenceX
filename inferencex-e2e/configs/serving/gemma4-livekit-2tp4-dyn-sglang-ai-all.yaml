# sglang ai-all, two engines: gemma4-livekit-tp4-dyn-sglang-ai-all on a full 8x H200 node as 2x TP4
# dynamo.sglang workers behind one Dynamo frontend KV router, the same shape as the prod vLLM config
# (gemma4-livekit-2tp4-dyn-vllm-prod). Engine and router flags are the single-engine config's; the only
# changes are replicas: 2, gpus: 8 and --router-min-initial-workers=2.
# This run checks the router with two workers to choose from:
# - each replica publishes KV events on its own ZMQ port (bench.sh adds --kv-events-config per replica;
#   server.log and server.1.log say "Setting up ZMQ kv event subscriber for dp_rank=0"), so the router's
#   prefix index sees both workers' caches;
# - hard session affinity (x-dynamo-session-id from aiperf's correlation id) keeps every turn of a call
#   on one worker, so later turns hit the prefix cache;
# - the selector debug log in router.log has every decision's per-worker cost terms, so requests per
#   worker and the overlap that picked them can be counted.
# c150 is the prod per-node load (compare with prod CI 41402074324 c150); c200 is twice the single
# engine's c100 (CI 42098764945), the point where both workers should each carry ~100 sessions.
#   inferencex-e2e/utils/serving/dispatch.sh inferencex-e2e/configs/serving/gemma4-livekit-2tp4-dyn-sglang-ai-all.yaml --ref bench/gemma4-sglang-ai-all-dyn
name: gemma4-livekit-2tp4-dyn-sglang-ai-all
runner: cluster:hcm-hgx01
image: vcr.vngcloud.vn/108942-public69/dynamo-stack/sglang-runtime:0.5.22-ai-all-dyn1.6.0-g4p2
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 8
replicas: 2
precision: fp8
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
  SGLANG_GEMMA4_RSAG: "1"
  AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
serve: |
  python3 -m dynamo.sglang
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tp 4
  --context-length 262144
  --max-running-requests 160
  --attention-backend fa3
  --page-size 64
  --kv-cache-dtype fp8_e4m3
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.92
  --enable-cache-report --enable-metrics
  --trust-remote-code
  --cuda-graph-backend-prefill breakable
  --dyn-tool-call-parser gemma4 --dyn-reasoning-parser gemma4
router:
  image: vcr.vngcloud.vn/108942-public69/dynamo-stack/sglang-runtime:0.5.22-ai-all-dyn1.6.0-g4p2
  env:
    FASTOKENS_BPE_THREADS: "4"
    DYN_PARSER_VERSION: "2"
    DYN_LOG: info,dynamo_kv_router::scheduling::selector=debug
  serve: |
    python3 -m dynamo.frontend
    --router-mode=kv --router-prefill-load-scale=16 --router-min-initial-workers=2
    --router-session-affinity-ttl-secs=1800 --router-session-affinity-mode=hard
    --tokenizer fastokens
scenario: livekit
conc: [150, 200]
