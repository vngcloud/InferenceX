# MAX-parity arm: plain SGLang BF16 on the LiveKit v1.1-warm trace (1200 s) at MAX's CCU 8,
# mirroring stock MAX jobs 9508/9643 (EAGLE MTP3).
name: qwen38-bf16-sgl-tp1-livekit
runner: cluster:han-h200-01
image: lmsysorg/sglang:v0.5.23
model: Qwen/Qwen3.8-27B
gpus: 1
precision: bf16
env:
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
serve: |
  python3 -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B
  --trust-remote-code
  --tp 1
  --context-length 262144
  --max-running-requests 64
  --attention-backend flashinfer
  --chunked-prefill-size 8192
  --max-prefill-tokens 16384
  --schedule-policy shortest-prefill-first
  --mem-fraction-static 0.85
  --mamba-full-memory-ratio 1.5
  --speculative-algorithm EAGLE --speculative-num-steps 3
  --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
  --enable-linear-replayssm-spec
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --enable-metrics --enable-cache-report
scenario: livekit
conc: [8]
