# MTP probe arm: the mtp4 config (NEXTN, gemma-4 assistant draft, steps 4, draft 5) at fixed conc 64.
# mtp4 at c48 beat its base arm by +16% (1,759 vs 1,516 tok/s) while mtp4 at c96 lost 11% under the
# saturated GPU; this arm and the c80 one bracket the crossover to find the MTP throughput peak.
name: gemma4-sgl-tp1-ai1rc-isl8k-c90-mtp4-c64
runner: cluster:hcm-hgx02
image: /mnt/thanglq5-enroot/images/sglang-v0.5.22-ai1rc-cdce95199f-amd64.sqsh
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 1
precision: fp8
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
  FASTOKENS_BPE_THREADS: "4"
  SGLANG_PARALLEL_PROMPT_ENCODE: "0"
serve: |
  python3 -m sglang.launch_server
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --tp 1
  --context-length 262144
  --max-running-requests 64
  --attention-backend fa3
  --page-size 64
  --kv-cache-dtype fp8_e4m3
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.90
  --enable-cache-report --enable-metrics
  --tool-call-parser gemma4 --reasoning-parser gemma4
  --trust-remote-code
  --cuda-graph-backend-prefill breakable
  --tokenizer-backend fastokens
  --speculative-algorithm NEXTN
  --speculative-draft-model-path google/gemma-4-31B-it-assistant
  --speculative-num-steps 4
  --speculative-eagle-topk 1
  --speculative-num-draft-tokens 5
scenario: synthetic
workload: {isl: [8k], osl: [1k], cache: [90], search: false}
conc: [64]
