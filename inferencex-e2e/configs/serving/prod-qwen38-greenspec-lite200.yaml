# Pattern: a production config replayed on GreenSpec v1.1.2 lite, first 200 rows (16-17 per bucket, all 12 buckets), base vs the production MTP.
# Source: general-docs production/qwen3.8/deployment.yaml (snapshot 2026-11-03, cluster HAN 1xH200):
# single SGLang server, 1M context through the yarn override. Production runs the VCR mirror of
# lmsysorg/sglang:v0.5.23 with ConfigMap qwen38-sglang-qc-fixes over 5 files; this run uses the stock
# image without those fixes. Served name left out (the benchmark uses the HF id). The base arm is
# production without the EAGLE flags and --enable-linear-replayssm-spec.
name: prod-qwen38-greenspec-lite200
runner: h200-han
image: lmsysorg/sglang:v0.5.23
model: Qwen/Qwen3.8-27B-FP8
gpus: 1
precision: fp8
env:
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
  SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
serve: |
  python3 -m sglang.launch_server
  --model-path Qwen/Qwen3.8-27B-FP8
  --trust-remote-code
  --kv-cache-dtype fp8_e4m3
  --mem-fraction-static 0.85
  --attention-backend fa3
  --chunked-prefill-size 8192
  --max-prefill-tokens 16384
  --json-model-override-args '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  --context-length 1000000
  --max-running-requests 64
  --mamba-full-memory-ratio 1.5
  --schedule-policy dfs-weight
  --enable-hierarchical-cache --hicache-size 24
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --enable-metrics --enable-cache-report
arms:
  base: {}
  mtp:
    append: |
      --speculative-algorithm EAGLE --speculative-num-steps 3
      --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
      --enable-linear-replayssm-spec
scenario: greenspec
overrides:
  subset: diverse
  lite: true
  requests: 200
  mode: prod-thinking
  preflight: drop
conc: [1, 16, 64]
