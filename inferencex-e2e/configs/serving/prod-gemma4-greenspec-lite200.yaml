# Pattern: a production config replayed on GreenSpec v1.1.2 lite, first 200 rows (16-17 per bucket, all 12 buckets), base vs the production MTP.
# Source: general-docs production/gemma-4/deployment.yaml (snapshot 2026-11-03, cluster HCM): two
# single-GPU vLLM engines (eagle-a/b) behind vllm-router cache_aware. Engine and router flags as in
# production, except the wiring (host/port, worker URLs, prometheus port, worker startup timeout) and
# the served name (the HF id). The base arm is production without --speculative-config.
# preflight drop: vLLM needs input + max_tokens inside 262144.
name: prod-gemma4-greenspec-lite200
runner: h200-hcm
image: vcr.vngcloud.vn/108942-public69/vllm-stack/vllm-openai:v0.25.1
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 2
replicas: 2
precision: fp8block
env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
  NCCL_P2P_LEVEL: NVL
serve: |
  vllm serve RedHatAI/gemma-4-31B-it-FP8-block
  --served-model-name RedHatAI/gemma-4-31B-it-FP8-block
  --tensor-parallel-size 1
  --gpu-memory-utilization 0.92
  --max-model-len 262144
  --max-num-seqs 64
  --max-num-batched-tokens 16384
  --enable-chunked-prefill
  --long-prefill-token-threshold 8192
  --kv-cache-metrics
  --enable-prompt-tokens-details
  --enable-auto-tool-choice
  --tool-call-parser gemma4
  --reasoning-parser gemma4
router:
  image: vcr.vngcloud.vn/108942-public69/vllm-stack/vllm-openai:v0.25.1
  serve: >-
    bash -c "python3 -m pip install -q vllm-router==0.1.14
    && exec vllm-router --host 0.0.0.0 --port {{router_port}}
    --worker-urls {{engine_urls}} --policy cache_aware
    --prometheus-host 127.0.0.1 --prometheus-port {{router_metrics_port}}
    --request-timeout-secs 14400 --disable-retries --worker-startup-timeout-secs 3600"
arms:
  base: {}
  mtp4:
    append: |
      --speculative-config '{"model": "google/gemma-4-31B-it-assistant", "num_speculative_tokens": 4, "method": "mtp"}'
scenario: greenspec
overrides:
  subset: diverse
  lite: true
  requests: 200
  mode: prod-thinking
  preflight: drop
conc: [1, 16, 64]
