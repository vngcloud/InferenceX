# Pattern: Dynamo frontend (KV router) + dynamo.sglang engine. GLM-5.3 W4AFP8 on 8xH200, AgentX (full duration).
# Second-best Dynamo router arm of the DP4 study (ATRA P01 routing, #33510): dynamo-lockstep-cost-fn.
# DP-attention ranks run every forward pass together and a pass with any prefill carries no decode, so
# the policy prices the stall a request adds to all ranks:
#   cost(r) = alpha * max(0, B_r + P_r - B_max) + beta * P_r      (B = queued prefill, P = this prefill)
# alpha 0.56 / beta 0.44 from job 6710; the decode and wait terms are off (gamma = delta = 0); host-tier hits
# reload at 0.1 of a miss. It cuts serialized prefill ~5% vs 2tier-prod-host but still lands below it, so
# prefer glm53-w4afp8-dynamo-2tier-prod-host.yaml; this one is kept as the reference cost-model arm.
# Engine is DP4 (--tp=8 --dp=4 --ep=8) like prod GLM-5.3.
# Image: same as glm53-w4afp8-dynamo-2tier-prod-host.yaml (vcr .../sglang-runtime:1.5.0-2tier-lockstep,
# https://github.com/DinhKhangHoang/dynamo/tree/vng/two-tier-host-tier, policy in /opt/rbench/router-policies/).
# Results (Slurm 8xH200, same engine flags, AgentX full, input tok/s/GPU):
#   c48: 9145 (job 7694), 9257 (job 8835); 2tier-prod-host 9310/9218; smg cache_aware --dp-aware 9391; Dynamo kv ps16 (prod) ~7100
# Device timer (job 8835 vs 2tier job 7723, c48): prefill passes take 38% vs 36% of each rank's time and ranks sit
# idle in 57% of it in both; 54% of prefill tokens still run in passes where only one rank prefills. The policy
# evens the hourly prefill per rank (max/mean 1.09 vs 1.22) but can't line prefills up within a pass.
name: glm53-w4afp8-dynamo-lockstep-ab
runner: cluster:hcm-hgx02
image: vcr.vngcloud.vn/108942-public69/dynamo-stack/sglang-runtime:1.5.0-2tier-lockstep  # engine image
model: PhalaCloud/GLM-5.3-W4AFP8
gpus: 8
precision: w4afp8
env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  SGLANG_DP_USE_GATHERV: "1"
  NCCL_P2P_LEVEL: NVL
  HF_HUB_OFFLINE: "1"
  NVSHMEM_REMOTE_TRANSPORT: none
  SGLANG_ENABLE_METRICS_DP_ATTENTION: "1"
  SGLANG_ENABLE_METRICS_DEVICE_TIMER: "1"
serve: |
  python3 -m dynamo.sglang
  --model-path=PhalaCloud/GLM-5.3-W4AFP8
  --served-model-name=zai-org/GLM-5.3
  --quantization=w4afp8 --tp=8 --dp=4 --ep=8
  --enable-dp-attention --enable-dp-attention-local-control-broadcast --enable-dp-lm-head
  --dist-init-addr=127.0.0.1:10888
  --moe-a2a-backend=deepep --chunked-prefill-size=32768
  --tool-call-parser=glm47 --reasoning-parser=glm45
  --mem-fraction-static=0.75 --max-running-requests=256 --context-length=300000
  --kv-cache-dtype=fp8_e4m3 --dsa-prefill-backend=flashmla_sparse_q8 --allow-auto-truncate
  --enable-metrics --enable-metrics-for-all-schedulers --enable-cache-report
  --enable-hierarchical-cache --hicache-size=128 --hicache-io-backend=direct --hicache-write-policy=write_back
  --speculative-algorithm=EAGLE --speculative-num-steps=3 --speculative-eagle-topk=1 --speculative-num-draft-tokens=4
  --schedule-policy=dfs-weight --enable-prefill-delayer
  --kv-events-config='{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:8900"}'
router:
  image: vcr.vngcloud.vn/108942-public69/dynamo-stack/sglang-runtime:1.5.0-2tier-lockstep
  env:
    # one debug row per rank per routing decision (every cost term) in router.log
    DYN_LOG: info,dynamo_kv_router::scheduling::selector=debug
  serve: |
    python3 -m dynamo.frontend
    --http-host=0.0.0.0 --http-port=8888
    --router-mode=kv --router-min-initial-workers=1
    --dyn-chat-processor=sglang --dyn-preprocess-workers=8
    --tool-call-parser=glm47 --reasoning-parser=glm45
    --router-policy-config=/opt/rbench/router-policies/lockstep-ab.yaml
scenario: agentx
conc: [48, 64]
