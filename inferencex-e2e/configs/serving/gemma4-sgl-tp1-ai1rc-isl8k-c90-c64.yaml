# Pattern: synthetic workload at fixed concurrency. Gemma-4-31B FP8-block on the ai1rc engine image
# (sglang v0.5.22 baa9befa + the Gemma-4 patch stack cdce95199f: per-layer FA3/FA4 routing
# sgl-project/sglang#44399, FA4 SM90 FP8 e4m3 KV head_dim 512 sgl-project/sglang#46965, SM90 FP8
# head_dim-512 attention kernels sgl-project/sglang#42019, frozen-KV MTP target pool fix
# sgl-project/sglang#42565, Gemma4TextModel input_embeds), 1xH200, TP1, ISL 8k / OSL 1k at 90%
# prefix cache, fixed conc 64 for a fast validation run. TP1 baseline arm for upcoming optimization.
# The sqsh is node-local on hgx-h200-01, so this YAML must run on cluster:hcm-hgx01.
name: gemma4-sgl-tp1-ai1rc-isl8k-c90-c64
runner: cluster:hcm-hgx01
image: /mnt/ngoctg2-enroot/images/sglang-v0.5.22-ai1rc-cdce95199f-amd64.sqsh
model: RedHatAI/gemma-4-31B-it-FP8-block
gpus: 1
precision: fp8
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
  NCCL_P2P_LEVEL: NVL
  FASTOKENS_BPE_THREADS: "4"
  SGLANG_PARALLEL_PROMPT_ENCODE: "0"
serve: |
  python3 -m sglang.launch_server
  --model-path RedHatAI/gemma-4-31B-it-FP8-block
  --tp 1
  --context-length 262144
  --max-running-requests 64
  --attention-backend fa3
  --page-size 64
  --kv-cache-dtype fp8_e4m3
  --chunked-prefill-size 4096
  --schedule-policy shortest-prefill-first
  --swa-full-tokens-ratio 0.2
  --mem-fraction-static 0.92
  --enable-cache-report --enable-metrics
  --tool-call-parser gemma4 --reasoning-parser gemma4
  --trust-remote-code
  --cuda-graph-backend-prefill breakable
  --tokenizer-backend fastokens
scenario: synthetic
workload: {isl: [8k], osl: [1k], cache: [90], search: false}
conc: [64]
