# Sweep-scenario reference: ISL 8192 (50% shared prefix) / OSL 512 / cache 50.
# Hand-written and verified against the aiperf mock server (scheduler knee at
# concurrency 32) during the 2026-10-17 spike; see
# docs/superpowers/plans/2026-10-17-sweep-scenarios-spike-notes.md.
# Per-run values (url, model, tokenizer, artifact dir) are CLI overrides.
schemaVersion: "2.0"
benchmark:
  unsafeOverride: true
  endpoint:
    type: chat
    path: /v1/chat/completions
    streaming: true
    useServerTokenCount: true
    extra:
      ignore_eos: true   # guarantee OSL: server generates exactly max_tokens
  datasets:
  - name: main
    type: synthetic
    entries: 1000
    randomSeed: 42
    isl: 4096             # unique part; prefix_prompts adds 4096 shared tokens on top
    osl: 512
    prefix_prompts:
      shared_system_length: 4096
  phases:
  - name: profiling
    kind: profiling
    type: concurrency
    duration: 300.0
    gracePeriod: 30.0
    failedRequestThreshold: 0.1
sweep:
  type: adaptive_search
  planner: smooth_isotonic
  objectives:
  - {metric: output_token_throughput, stat: avg, direction: maximize}
  search_space:
  - {path: phases.profiling.concurrency, lo: 1, hi: 512, kind: int}
  sla_filters:
  - {metric_tag: time_to_first_token, stat: avg, op: lt, threshold: 8000.0}
  - {metric_tag: inter_token_latency, stat: p90, op: lt, threshold: 50.0}
  max_iterations: 16
  sla_precision: normal
randomSeed: 42
