name: sgl-b-tau2cfg-p64
engine: sglang
image: ghcr.io/noridom1/sglang:v0.5.21-gemma4-fa4-swapool-3a7d5ad
model: RedHatAI/gemma-4-31B-it-FP8-block
served_model_name: google/gemma-4-31b-it
spec:
  kind: mtp
  draft: google/gemma-4-31B-it-assistant
  depth: 4
args:
  - --mem-fraction-static=0.92
  - --swa-full-tokens-ratio=0.2
  - --chunked-prefill-size=8192
  - --schedule-policy=hrrn
  - --attention-backend=fa4
  - --page-size=64
env:
  SGLANG_SWA_EVICTION_INTERVAL: "32"
