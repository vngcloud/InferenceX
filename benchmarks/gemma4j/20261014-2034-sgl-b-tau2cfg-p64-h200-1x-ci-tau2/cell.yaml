  # the page-1 baseline ran the Python TreeCore ("Rust TreeCore toolchain is unavailable"), so pin it
  SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND: "python"
context_length: 262144
max_running: 32
baseline: sgl-b-tau2cfg
notes: "sgl-b-tau2cfg with --page-size 64 (A/B vs page 1, 2026-10-14)"
